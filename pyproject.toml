[project]
name = "text2sql-agent-evals"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.5.0",
    "langchain-google-genai>=4.5.0",
    "langgraph>=1.2.22",
    "matplotlib>=3.11.2",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
